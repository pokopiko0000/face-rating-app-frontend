# fly.toml app configuration file generated for face-rating-backend
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "face-rating-backend"
primary_region = "nrt"  # Tokyo region for better latency in Japan

[build]
  # Use Dockerfile for custom dependencies (OpenCV, InsightFace)
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  PYTHONPATH = "/app"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0  # Allow scaling to 0 to save costs

[[http_service.checks]]
  grace_period = "30s"
  interval = "10s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[vm]
  # Use shared-cpu for cost optimization
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024  # Start with 1GB, can increase if needed

[[mounts]]
  source = "face_rating_data"
  destination = "/app/data"
  
[deploy]
  release_command = "python -c 'print(\"Backend deployment ready\")'"

# Resource allocation - optimize for cost
[metrics]
  port = 9091
  path = "/metrics"